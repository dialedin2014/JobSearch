version: '3.8'

services:
  app:
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile
    volumes:
      - ..:/workspace:cached
    command: sleep infinity
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=jobsearch_dev
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/jobsearch_dev
    depends_on:
      - postgres
    networks:
      - jobsearch-network

  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    volumes:
      - postgres-data:/var/lib/postgresql/data
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=jobsearch_dev
    ports:
      - "5432:5432"
    networks:
      - jobsearch-network

volumes:
  postgres-data:

networks:
  jobsearch-network:
    driver: bridge
